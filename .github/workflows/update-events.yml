# Keeps events.json up to date with real UK car events.
# Runs every 6 hours: one search for new organisers in a different part of the UK each time, then every page is
# checked. Pages that haven't changed (or have no dates) cost nothing; changed ones are read by Claude at batch price.
# You can run it by hand from the Actions tab.
name: Update events

on:
  schedule:
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'How to run'
        type: choice
        default: normal
        options: [normal, dry-run, quick-test, discover]

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Update events
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CAR_SHOW_REFRESH }}   # the repository secret holding the Anthropic API key
          MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: |
          # Every run also searches one new area or kind of event (it rotates through about 110, so the whole UK is
          # covered about once a month). "discover" by hand does four searches at once.
          ARGS="--discover"
          case "$MODE" in
            dry-run)    ARGS="--dry-run" ;;
            quick-test) ARGS="--sync --limit=2" ;;
            discover)   ARGS="--discover=4" ;;
          esac
          node scripts/update-events.mjs $ARGS

      - name: Save the results
        run: |
          git config user.name "events-updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in events.json data sources.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update events ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git pull --rebase
          git push
